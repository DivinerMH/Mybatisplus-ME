server {
	listen 80;
	server_name 192.168.1.103;
	proxy_connect_timeout 600;
	proxy_read_timeout 600;
	proxy_send_timeout 600;
	
	location ^~/api/ {
		proxy_redirect off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://192.168.1.103:28080/;

		proxy_buffer_size 1024k; #设置代理服务器（nginx）保存用户头信息的缓冲区大小
		proxy_buffers 16 1024k; #proxy_buffers缓冲区，网页平均在32k以下的设置
		proxy_busy_buffers_size 2048k; #高负荷下缓冲大小（proxy_buffers*2）
		proxy_temp_file_write_size 2048k;#设定缓存文件夹大小，大于这个值，将从upstream服务器传

	}

	location ^~/oss/ {
		proxy_redirect off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://192.168.1.103:29002/;
	}
	# 平远
	location /ops-ui {
		alias /app/smart-park/smart-park-ops-ui;
	        index index.html index.htm;
	        try_files $uri $uri/ /index.html;
	}
	
	location /portal-ui {
		alias /app/smart-park/smart-park-portal-ui;
        	index index.html index.htm;
	        try_files $uri $uri/ /index.html;
	}
 
 	location /digital-ui {
		alias /app/smart-park/smart-park-digital-ui;
	        index index.html index.htm;
        	try_files $uri $uri/ /index.html;
	}

	# 广清
	location /guangqing/ops-ui {
                alias /app/smart-park/guangqing/smart-park-ops-ui;
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
        }

        location /guangqing/portal-ui {
                alias /app/smart-park/guangqing/smart-park-portal-ui;
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
        }

        location /guangqing/digital-ui {
                alias /app/smart-park/guangqing/smart-park-digital-ui;
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
        }


}
